services:
  # Backend Django API
  - type: web
    name: aws-exam-backend
    runtime: python
    plan: free
    rootDir: backend
    # Avoid DB-dependent commands during build.
    # On Render free Postgres can be sleeping, causing migrations to fail during deploy/build.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    # Run DB migrations at runtime with retries until Postgres is reachable.
    startCommand: "sh -c 'i=0; until python manage.py migrate --noinput; do i=$((i+1)); if [ $i -ge 60 ]; then echo DB unreachable after retries; exit 1; fi; echo Waiting for database attempt $i/60; sleep 10; done; python manage.py create_exams; python manage.py import_questions; python manage.py create_superuser; exec gunicorn aws_exam_backend.wsgi:application --bind 0.0.0.0:$PORT'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: MANUS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com"
      - key: DEEPSEEK_MODEL
        value: "deepseek-chat"
      - key: DATABASE_URL
        fromDatabase:
          name: aws-exam-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: aws_exam_backend.settings
      - key: DEBUG
        value: "False"
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,freecertify.org,www.freecertify.org"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: aws-exam-frontend
          property: host
    healthCheckPath: /api/exams/
    
  # Frontend React App (Static Site)
  - type: web
    name: aws-exam-frontend
    env: static
    rootDir: typescript_simplified_app_with_timer
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aws-exam-backend
          property: host
          suffix: /api
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false

databases:
  - name: aws-exam-db
    plan: free
    databaseName: aws_exam_db
    user: aws_exam_user
